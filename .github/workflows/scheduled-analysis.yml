name: Trading Analysis

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Override tickers (comma-separated, leave empty to use tickers.txt)'
        required: false
        default: ''
  repository_dispatch:
    types: [run-analysis]

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpango-1.0-0 \
            libpangocairo-1.0-0 \
            libgdk-pixbuf-2.0-0 \
            libffi-dev \
            shared-mime-info

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -e .

      - name: Run analysis
        env:
          # LLM Configuration
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_DEEP_THINK_MODEL: ${{ secrets.LLM_DEEP_THINK_MODEL }}
          LLM_QUICK_THINK_MODEL: ${{ secrets.LLM_QUICK_THINK_MODEL }}
          LLM_BACKEND_URL: ${{ secrets.LLM_BACKEND_URL }}

          # Embedding Configuration
          EMBEDDING_PROVIDER: ${{ secrets.EMBEDDING_PROVIDER }}
          EMBEDDING_MODEL: ${{ secrets.EMBEDDING_MODEL }}

          # Data Source API Keys
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

          # Cloudflare R2 Storage
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}

          # Storage
          DB_PATH: ./data/jobs.db
          REPORTS_OUTPUT_DIR: ./reports
          JOB_TIMEOUT: 3600
        run: |
          # Start API server in background
          python -m tradingagents.api.main &
          API_PID=$!

          # Wait for API to be ready
          for i in $(seq 1 30); do
            if curl -s http://localhost:8000/api/v1/health > /dev/null 2>&1; then
              echo "API is ready"
              break
            fi
            sleep 1
          done

          # Determine tickers
          CUSTOM_TICKERS="${{ github.event.inputs.tickers || github.event.client_payload.tickers || '' }}"
          if [ -n "$CUSTOM_TICKERS" ]; then
            TICKERS=$(echo "$CUSTOM_TICKERS" | tr ',' '\n' | xargs | tr ' ' ',')
          else
            TICKERS=$(grep -v '^#' tickers.txt | grep -v '^$' | tr '\n' ',' | sed 's/,$//')
          fi

          echo "Submitting analysis for tickers: $TICKERS"

          # Submit jobs sequentially (one at a time)
          FAILED=0
          IFS=',' read -ra TICKER_ARRAY <<< "$TICKERS"
          for TICKER in "${TICKER_ARRAY[@]}"; do
            echo "--- Submitting $TICKER ---"
            RESPONSE=$(curl -s -X POST http://localhost:8000/api/v1/jobs \
              -H "Content-Type: application/json" \
              -d "{\"ticker\": \"$TICKER\"}")
            echo "Submit response: $RESPONSE"

            JOB_ID=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin)['job_id'])")
            echo "Job ID: $JOB_ID"

            # Poll until complete or timeout
            TIMEOUT=7200
            ELAPSED=0
            while [ $ELAPSED -lt $TIMEOUT ]; do
              STATUS=$(curl -s http://localhost:8000/api/v1/jobs/$JOB_ID | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])")
              echo "Job $JOB_ID ($TICKER): $STATUS"
              if [ "$STATUS" = "completed" ] || [ "$STATUS" = "failed" ] || [ "$STATUS" = "cancelled" ]; then
                break
              fi
              sleep 30
              ELAPSED=$((ELAPSED + 30))
            done

            # Print result
            echo "--- Result for $TICKER ---"
            curl -s http://localhost:8000/api/v1/jobs/$JOB_ID | python3 -m json.tool

            if [ "$STATUS" = "failed" ]; then
              FAILED=1
            fi
          done

          # Stop API
          kill $API_PID 2>/dev/null || true

          exit $FAILED

      - name: Upload reports as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trading-reports-${{ github.run_number }}
          path: reports/
          retention-days: 30
          if-no-files-found: ignore
