name: Trading Analysis

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Override tickers (comma-separated, leave empty to use tickers.txt)'
        required: false
        default: ''
  repository_dispatch:
    types: [run-analysis]

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpango-1.0-0 \
            libpangocairo-1.0-0 \
            libgdk-pixbuf-2.0-0 \
            libffi-dev \
            shared-mime-info

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -e .

      - name: Start API and Worker
        env:
          # LLM Configuration
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_DEEP_THINK_MODEL: ${{ secrets.LLM_DEEP_THINK_MODEL }}
          LLM_QUICK_THINK_MODEL: ${{ secrets.LLM_QUICK_THINK_MODEL }}
          LLM_BACKEND_URL: ${{ secrets.LLM_BACKEND_URL }}

          # Embedding Configuration
          EMBEDDING_PROVIDER: ${{ secrets.EMBEDDING_PROVIDER }}
          EMBEDDING_MODEL: ${{ secrets.EMBEDDING_MODEL }}

          # Data Source API Keys
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

          # Cloudflare R2 Storage
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}

          # Redis and Storage
          REDIS_URL: redis://localhost:6379/0
          DB_PATH: ./data/jobs.db
          REPORTS_OUTPUT_DIR: ./reports
          MAX_WORKERS: 1
          JOB_TIMEOUT: 3600
        run: |
          # Start worker in background
          python -m tradingagents.api.worker &
          WORKER_PID=$!

          # Start API server in background
          python -m tradingagents.api.main &
          API_PID=$!

          # Wait for API to be ready
          for i in $(seq 1 30); do
            if curl -s http://localhost:8000/api/v1/health > /dev/null 2>&1; then
              echo "API is ready"
              break
            fi
            sleep 1
          done

          # Determine tickers
          CUSTOM_TICKERS="${{ github.event.inputs.tickers || github.event.client_payload.tickers || '' }}"
          if [ -n "$CUSTOM_TICKERS" ]; then
            TICKERS=$(echo "$CUSTOM_TICKERS" | tr ',' '\n' | xargs | tr ' ' ',')
          else
            TICKERS=$(grep -v '^#' tickers.txt | grep -v '^$' | tr '\n' ',' | sed 's/,$//')
          fi

          echo "Submitting analysis for tickers: $TICKERS"

          # Submit job(s) via API
          RESPONSE=$(curl -s -X POST http://localhost:8000/api/v1/jobs \
            -H "Content-Type: application/json" \
            -d "{\"tickers\": [\"$(echo $TICKERS | tr ',' '","')\"]}")
          echo "Submit response: $RESPONSE"

          # Extract first job ID and poll all jobs until complete
          JOBS=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(' '.join(d['job_ids']))")
          echo "Job IDs: $JOBS"

          # Poll until all jobs complete or timeout
          TIMEOUT=7200
          ELAPSED=0
          while [ $ELAPSED -lt $TIMEOUT ]; do
            ALL_DONE=true
            for JOB_ID in $JOBS; do
              STATUS=$(curl -s http://localhost:8000/api/v1/jobs/$JOB_ID | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])")
              echo "Job $JOB_ID: $STATUS"
              if [ "$STATUS" != "completed" ] && [ "$STATUS" != "failed" ] && [ "$STATUS" != "cancelled" ]; then
                ALL_DONE=false
              fi
            done
            if [ "$ALL_DONE" = true ]; then
              echo "All jobs finished"
              break
            fi
            sleep 30
            ELAPSED=$((ELAPSED + 30))
          done

          # Print final results
          for JOB_ID in $JOBS; do
            echo "--- Job $JOB_ID ---"
            curl -s http://localhost:8000/api/v1/jobs/$JOB_ID | python3 -m json.tool
          done

          # Stop services
          kill $API_PID $WORKER_PID 2>/dev/null || true

          # Check if any failed
          FAILED=0
          for JOB_ID in $JOBS; do
            STATUS=$(curl -s http://localhost:8000/api/v1/jobs/$JOB_ID | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])")
            if [ "$STATUS" = "failed" ]; then
              FAILED=1
            fi
          done

          exit $FAILED

      - name: Upload reports as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trading-reports-${{ github.run_number }}
          path: reports/
          retention-days: 30
          if-no-files-found: ignore
