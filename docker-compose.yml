services:
  api:
    build: .
    command: ["python", "-m", "tradingagents.api.main"]
    ports:
      - "${API_PORT:-8000}:8000"
    env_file: .env
    environment:
      - DB_PATH=/app/data/jobs.db
      - REPORTS_OUTPUT_DIR=/app/reports
    volumes:
      - app-data:/app/data
      - app-reports:/app/reports

volumes:
  app-data:
  app-reports:
