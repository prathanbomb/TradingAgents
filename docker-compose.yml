services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    command: ["python", "-m", "tradingagents.api.main"]
    ports:
      - "${API_PORT:-8000}:8000"
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DB_PATH=/app/data/jobs.db
      - REPORTS_OUTPUT_DIR=/app/reports
    volumes:
      - app-data:/app/data
      - app-reports:/app/reports
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build: .
    command: ["python", "-m", "tradingagents.api.worker"]
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DB_PATH=/app/data/jobs.db
      - REPORTS_OUTPUT_DIR=/app/reports
    volumes:
      - app-data:/app/data
      - app-reports:/app/reports
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis-data:
  app-data:
  app-reports:
